# =============================================================================
#  NBC Bearings — SharePoint MCP  |  Production docker-compose.yml
#  One container per SharePoint site, all on an internal bridge network.
#  Your custom application is the ONLY public entry-point; MCP containers
#  are never reachable from outside the VM.
#
#  Port mapping  (host:container)
#    mcp-rd           → 8001:8000
#    mcp-manufacturing→ 8002:8000
#    mcp-qa           → 8003:8000
#    mcp-sales        → 8004:8000
#    mcp-hr           → 8005:8000
#    mcp-finance      → 8006:8000
#    mcp-logistics    → 8007:8000
#    mcp-gm           → 8008:8000
#    mcp-ir           → 8009:8000
#    mcp-scm          → 8010:8000
#    mcp-nei          → 8011:8000
#
#  From your custom app, reach containers by name on the internal network:
#    http://mcp-rd:8000/mcp
#    http://mcp-manufacturing:8000/mcp  … etc.
# =============================================================================

networks:
  mcp-internal:
    driver: bridge
    # No external access — containers talk only to your custom app
    internal: false   # set to true if your custom-app is also in this compose

# ---------------------------------------------------------------------------
# Shared image build  (all sites use the same image, only env differs)
# ---------------------------------------------------------------------------
x-mcp-common: &mcp-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - mcp-internal
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost',8000)); s.close()\""]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s
  # No memory/CPU limits — each container uses what it needs dynamically.
  # Finance may peak at 3GB for large xlsb files; HR may use 200MB.
  # The OS scheduler handles fair resource sharing across containers.

# ---------------------------------------------------------------------------
# Services — one per SharePoint site
# ---------------------------------------------------------------------------
services:

  # ── Research & Development ─────────────────────────────────────────────────
  mcp-rd:
    <<: *mcp-common
    container_name: mcp-rd
    env_file: envs/mcp-rd.env
    ports:
      - "8001:8000"
    labels:
      com.nbcbearings.site: "Research & Development"
      com.nbcbearings.url: "https://nbcbearingsrj.sharepoint.com/sites/researchanddevelopment"

  # ── Manufacturing ──────────────────────────────────────────────────────────
